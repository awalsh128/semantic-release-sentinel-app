# Pull requests target staging, since main only fast-forwards to it. Titles use the build type, which
# doesn't trigger a release; retitle a pull request as fix: when a runtime dependency update should
# ship. Grouping keeps one pull request per ecosystem and update type. The cooldown skips releases
# younger than a week, giving a compromised release time to be caught and pulled.
version: 2

updates:
  # Workflows and the composite actions under .github/actions, whose SHA pins this keeps current.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The app's dependencies.
  - package-ecosystem: npm
    directories:
      - "/"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Majors follow engines.node, the oldest Node the app supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Version 10 needs conventional-changelog-writer 9, but @semantic-release/release-notes-generator
      # still loads writer 8, so release notes fail to render. release.yml pins 9.3.1 for the same
      # reason; lift this and that pin together when the generator supports writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]

  # The base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The image runs on Node 22 on purpose (see the Dockerfile); move it deliberately, not by bot.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
