# Octo STS trust policy for the release workflow (see docs/release-setup.md). Octo STS reads it from
# the default branch, so a pull request can't change it. Only release.yml running on main or staging
# gets a token, with just the permission needed to push the release tag.
issuer: https://token.actions.githubusercontent.com
# GitHub puts the immutable owner and repository ids in this repository's OIDC subject, so the
# subject has them too. They also stop a renamed or recreated repository from matching. The part
# after the ids is the ref, which claim_pattern restricts.
subject_pattern: "repo:awalsh128@2087466/semantic-release-sentinel-app@1459438369:.*"
claim_pattern:
  ref: "refs/heads/(main|staging)"
  job_workflow_ref: "awalsh128/semantic-release-sentinel-app/\\.github/workflows/release\\.yml@refs/heads/(main|staging)"

permissions:
  contents: write
