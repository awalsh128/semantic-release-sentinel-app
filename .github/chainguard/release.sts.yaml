# Octo STS trust policy for the release workflow (see docs/release-setup.md). Octo STS reads it from
# the default branch, so a pull request can't change it. Only release.yml running on main gets a
# token, with just the permission needed to push the release tag.
issuer: https://token.actions.githubusercontent.com
subject: repo:awalsh128/semantic-release-sentinel-app:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: awalsh128/semantic-release-sentinel-app/\.github/workflows/release\.yml@refs/heads/main

permissions:
  contents: write
