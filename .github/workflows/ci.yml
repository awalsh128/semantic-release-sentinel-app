name: CI

# Type-checks and tests the app on pull requests and on staging. After every job passes on a push to
# staging, it releases a candidate (see release.yml). main only ever fast-forwards to a staging commit
# that passed here (see promote.yml), so it has no push trigger of its own.
on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips husky's prepare hook, which CI doesn't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  # Release candidates are only cut from staging commits that pass CI.
  release-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: test
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
