name: Release

# Releases with semantic-release, always gated by CI: a git tag and GitHub release, then the
# container image is pushed to GHCR. Runs that release nothing (docs, chore, ...) skip the image.
# - staging: ci.yml calls this after every CI job passes, releasing a candidate (e.g. 0.2.0-rc.1).
#   The image is tagged with that version only, never 'latest'.
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 0.2.0). The image is also tagged 'latest'.
# - Manual runs first require a successful CI run for the commit.
#
# Start the version line at 0.x by tagging the first commit v0.0.0 before the first run;
# otherwise semantic-release's first release is always 1.0.0.
#
# main, staging and v* tags are protected by rulesets (.github/rulesets) that GITHUB_TOKEN can't
# bypass, so the tag is pushed with a short-lived token from Octo STS, which the rulesets let
# bypass. The token comes from this run's OIDC identity under the trust policy
# .github/chainguard/release.sts.yaml, so there is no stored secret. See docs/release-setup.md.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without tagging or pushing anything"
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One release at a time; never cancel one that is tagging.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # Check CI results on manual runs
      id-token: write # Federate an Octo STS token from this run's OIDC identity
      contents: write # Tags and GitHub releases
      issues: write # semantic-release comments
      pull-requests: write # semantic-release comments
      packages: write # Push the image to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false # so git pushes with the Octo STS token, not GITHUB_TOKEN

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # GITHUB_TOKEN can't bypass the rulesets. Octo STS exchanges this run's OIDC identity for a
      # token with the permissions in .github/chainguard/release.sts.yaml, and only for release.yml
      # running on main or staging.
      - name: Get a release token from Octo STS
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: release

      # The release tools are pinned here rather than in package.json, so their dependencies don't
      # reach the project's audit.
      - name: Release with semantic-release
        id: semantic-release
        shell: bash
        env:
          # semantic-release pushes the tag with GIT_CREDENTIALS and calls the GitHub API (release,
          # comments) with GITHUB_TOKEN, so the Octo STS token only needs Contents: write.
          GIT_CREDENTIALS: x-access-token:${{ steps.octo-sts.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          npx --yes \
            --package semantic-release@25.0.9 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            --package @semantic-release/exec@7.1.0 \
            semantic-release "${args[@]}"

      - name: Push image to GHCR
        if: ${{ steps.semantic-release.outputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ steps.semantic-release.outputs.version }}
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:$VERSION")
          # Candidates (staging) are never 'latest'.
          [[ "$REF" == "refs/heads/main" ]] && tags+=(-t "$image:latest")
          docker build "${tags[@]}" .
          docker push --all-tags "$image"
